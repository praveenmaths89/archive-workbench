services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
      POSTGRES_DB: archive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    image: archive-workbench-api
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://archive:archive@db:5432/archive
      DATA_DIR: /data
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
    volumes:
      - appdata:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  worker:
    image: archive-workbench-api
    build: ./api
    command: ["python", "-m", "archive_workbench.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://archive:archive@db:5432/archive
      DATA_DIR: /data
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
    volumes:
      - appdata:/data
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
